[project]
name = "curvestudio-workspace"
version = "0.1.0.dev0"
description = "CurveStudio workspace root (not published)"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = ["curvestudio-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
curvestudio-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "import-linter>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: numerical benchmarks that take more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/core/src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
mypy_path = "packages/core/src"
strict = true

[tool.importlinter]
root_package = "curvestudio"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import GUI, web or database frameworks"
type = "forbidden"
source_modules = ["curvestudio"]
forbidden_modules = ["PySide6", "fastapi", "sqlalchemy", "starlette", "uvicorn"]
allow_indirect_imports = true


[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "openpyxl", "openpyxl.*", "sympy", "sympy.*"]
ignore_missing_imports = true
