[project]
name = "curvestudio-workspace"
version = "0.1.0.dev0"
description = "CurveStudio workspace root (not published)"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = ["curvestudio-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
curvestudio-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "import-linter>=2.16",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: numerical benchmarks that take more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/core/src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
mypy_path = "packages/core/src"
strict = true

[tool.importlinter]
root_package = "curvestudio"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import GUI, web or database frameworks"
type = "forbidden"
source_modules = ["curvestudio"]
forbidden_modules = ["PySide6", "fastapi", "sqlalchemy", "starlette", "uvicorn"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Nothing imports the command-line layer"
type = "forbidden"
source_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
]
forbidden_modules = ["curvestudio.cli"]

[[tool.importlinter.contracts]]
name = "Lower layers do not import statistics or diagnostics"
type = "forbidden"
source_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.testing",
]
forbidden_modules = ["curvestudio.statistics", "curvestudio.diagnostics"]

[[tool.importlinter.contracts]]
name = "Statistics sits below diagnostics and the command-line layer"
type = "forbidden"
source_modules = ["curvestudio.statistics"]
forbidden_modules = ["curvestudio.diagnostics", "curvestudio.cli"]

[[tool.importlinter.contracts]]
name = "Expressions are a pure grammar layer"
type = "forbidden"
source_modules = ["curvestudio.expressions"]
forbidden_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]

[[tool.importlinter.contracts]]
name = "Models import expressions only"
type = "forbidden"
source_modules = ["curvestudio.models"]
forbidden_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]

[[tool.importlinter.contracts]]
name = "The project format imports data and fitting only"
type = "forbidden"
source_modules = ["curvestudio.project"]
forbidden_modules = [
    "curvestudio.expressions",
    "curvestudio.models",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]
allow_indirect_imports = true

# scipy.odr (deprecated) cannot be a contract here: import-linter rejects subpackages of
# external packages. tests/unit/test_architecture.py::test_forbidden_odr_import enforces it.


[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "openpyxl", "openpyxl.*", "sympy", "sympy.*", "scipy", "scipy.*"]
ignore_missing_imports = true
