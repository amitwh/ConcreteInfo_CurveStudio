[project]
name = "curvestudio-workspace"
version = "0.1.0.dev0"
description = "CurveStudio workspace root (not published)"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = ["curvestudio-core", "curvestudio-models", "curvestudio-api", "curvestudio-engineering"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/web"] # JavaScript SPA: npm-managed, not a uv workspace member

[tool.uv.sources]
curvestudio-core = { workspace = true }
curvestudio-models = { workspace = true }
curvestudio-api = { workspace = true }
curvestudio-engineering = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "import-linter>=2.16",
    "statsmodels>=0.15.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: numerical benchmarks that take more than 5 seconds",
    "real_plugins: the test sees the installed curvestudio.models entry points (hidden by default)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/core/src", "packages/model_library/src", "apps/api/src", "tests", "packages/engineering/src"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
mypy_path = "packages/core/src:packages/model_library/src:apps/api/src:packages/engineering/src"
strict = true

[tool.importlinter]
root_packages = ["curvestudio", "curvestudio_models", "curvestudio_api", "curvestudio_engineering"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import GUI, web or database frameworks"
type = "forbidden"
source_modules = ["curvestudio"]
forbidden_modules = ["PySide6", "fastapi", "sqlalchemy", "starlette", "uvicorn"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Nothing imports the command-line layer"
type = "forbidden"
source_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
]
forbidden_modules = ["curvestudio.cli"]

[[tool.importlinter.contracts]]
name = "Lower layers do not import statistics or diagnostics"
type = "forbidden"
source_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.testing",
]
forbidden_modules = ["curvestudio.statistics", "curvestudio.diagnostics"]

[[tool.importlinter.contracts]]
name = "Statistics sits below diagnostics and the command-line layer"
type = "forbidden"
source_modules = ["curvestudio.statistics"]
forbidden_modules = ["curvestudio.diagnostics", "curvestudio.cli"]

[[tool.importlinter.contracts]]
name = "Expressions are a pure grammar layer"
type = "forbidden"
source_modules = ["curvestudio.expressions"]
forbidden_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]

[[tool.importlinter.contracts]]
name = "Models import expressions only"
type = "forbidden"
source_modules = ["curvestudio.models"]
forbidden_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]

[[tool.importlinter.contracts]]
name = "Nothing in core imports the workflow layer (only the apps do)"
type = "forbidden"
source_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.expressions",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]
forbidden_modules = ["curvestudio.workflow"]

[[tool.importlinter.contracts]]
name = "Workflow stays headless: no command-line layer"
type = "forbidden"
source_modules = ["curvestudio.workflow"]
forbidden_modules = ["curvestudio.cli", "curvestudio.testing"]

[[tool.importlinter.contracts]]
name = "The project format imports data and fitting only"
type = "forbidden"
source_modules = ["curvestudio.project"]
forbidden_modules = [
    "curvestudio.expressions",
    "curvestudio.models",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
    "curvestudio.cli",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Discovery sits above fitting, statistics and models, below the apps"
type = "forbidden"
source_modules = ["curvestudio.discovery"]
forbidden_modules = ["curvestudio.cli", "curvestudio.diagnostics", "curvestudio.workflow"]

[[tool.importlinter.contracts]]
name = "Nothing below discovery imports it"
type = "forbidden"
source_modules = [
    "curvestudio.data",
    "curvestudio.fitting",
    "curvestudio.models",
    "curvestudio.expressions",
    "curvestudio.testing",
    "curvestudio.statistics",
    "curvestudio.diagnostics",
]
forbidden_modules = ["curvestudio.discovery"]

[[tool.importlinter.contracts]]
name = "Core never imports the model catalogues (they register through the entry point)"
type = "forbidden"
source_modules = ["curvestudio"]
forbidden_modules = ["curvestudio_models", "curvestudio_engineering"]

[[tool.importlinter.contracts]]
name = "The engineering library does not import the general model library"
type = "forbidden"
source_modules = ["curvestudio_engineering"]
forbidden_modules = ["curvestudio_models"]

[[tool.importlinter.contracts]]
name = "The API reaches core only through the workflow layer (and its data/fitting types)"
type = "forbidden"
source_modules = ["curvestudio_api"]
forbidden_modules = [
    "curvestudio.cli",
    "curvestudio.diagnostics",
    "curvestudio.expressions",
    "curvestudio.models",
    "curvestudio.statistics",
    "curvestudio.testing",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Core never imports the API"
type = "forbidden"
source_modules = ["curvestudio"]
forbidden_modules = ["curvestudio_api"]

# scipy.odr (deprecated) cannot be a contract here: import-linter rejects subpackages of
# external packages. tests/unit/test_architecture.py::test_forbidden_odr_import enforces it.


[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "openpyxl", "openpyxl.*", "sympy", "sympy.*", "scipy", "scipy.*"]
ignore_missing_imports = true
