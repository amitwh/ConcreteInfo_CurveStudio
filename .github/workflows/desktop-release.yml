name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies (desktop group, PyInstaller included)
        run: uv sync --frozen --group desktop
      - name: Install Qt offscreen libraries (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - name: Build the bundle (icons, PyInstaller, frozen selftest, archive)
        run: uv run python apps/desktop/packaging/build.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run the frozen selftest from the release tree
        run: uv run python apps/desktop/packaging/build.py selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the Windows installer (Inno Setup, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install -y innosetup
          $version = uv run python -c "from importlib import metadata; print(metadata.version('curvestudio-desktop'))"
          iscc "/DMyAppVersion=$version" "apps\desktop\packaging\windows\curvestudio.iss"
      - name: Refresh the release checksums (adds the installer when it was built)
        run: uv run python apps/desktop/packaging/build.py sums
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curvestudio-desktop-${{ runner.os == 'Linux' && 'linux' || 'windows' }}
          path: dist/release/*
          if-no-files-found: error
      - name: Attach artifacts to the GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
