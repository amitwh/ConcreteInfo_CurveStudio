name: Desktop release

# Builds the desktop app on every supported platform and publishes one GitHub
# Release per `v*` tag.
#
#   push tag v0.10.3   -> Linux (.deb, .AppImage, .tar.gz) + Windows (.zip, setup)
#                         uploaded to the release for that tag
#   workflow_dispatch  -> a dry run: builds and uploads workflow artifacts only,
#                         nothing is published
#
# The tag must equal the app version (`apps/desktop/pyproject.toml`); the first
# step of each job refuses a mismatch, so a release can never be mislabelled.
# The build driver runs the frozen app's own selftest (window, table, plot, one
# fit, one Auto-fit through the spawn pool) before anything is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies (desktop group, PyInstaller included)
        run: uv sync --frozen --group desktop

      - name: Qt and Debian packaging libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
          libfontconfig1 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Fetch appimagetool (the AppImage builder is a host tool)
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/appimagetool" --version || true

      - name: Refuse a tag that does not match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run python -c "from importlib import metadata; print(metadata.version('curvestudio-desktop'))")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the app version ${version}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fast test gate (units + desktop widgets, no slow suites)
        run: uv run pytest tests/unit tests/desktop -q -m "not slow"

      - name: Build the bundle, the .deb, the AppImage and the checksums
        run: uv run python apps/desktop/packaging/build.py release

      - name: Verify every published artifact exists and is non-empty
        run: |
          version=$(uv run python -c "from importlib import metadata; print(metadata.version('curvestudio-desktop'))")
          for file in \
            "dist/release/curvestudio-desktop_${version}_amd64.deb" \
            "dist/release/curvestudio-desktop-${version}-linux-x86_64.AppImage" \
            "dist/release/curvestudio-desktop-${version}-linux-x86_64.tar.gz" \
            "dist/release/SHA256SUMS-linux-x86_64"; do
            test -s "$file" || { echo "::error::missing or empty artifact: $file"; exit 1; }
          done
          (cd dist/release && sha256sum -c SHA256SUMS-linux-x86_64)

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curvestudio-desktop-linux
          path: dist/release/*
          if-no-files-found: error

      - name: Release notes (the changelog section for this version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python apps/desktop/packaging/release_notes.py release-notes.md

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: CurveStudio ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies (desktop group, PyInstaller included)
        run: uv sync --frozen --group desktop

      - name: Refuse a tag that does not match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = uv run python -c "from importlib import metadata; print(metadata.version('curvestudio-desktop'))"
          if ("$env:GITHUB_REF_NAME".TrimStart("v") -ne $version) {
            Write-Error "tag $env:GITHUB_REF_NAME does not match the app version $version"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the bundle (icons, PyInstaller, frozen selftest, zip)
        run: uv run python apps/desktop/packaging/build.py

      - name: Windows installer (Inno Setup, best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install -y innosetup
          $version = uv run python -c "from importlib import metadata; print(metadata.version('curvestudio-desktop'))"
          iscc "/DMyAppVersion=$version" "apps\desktop\packaging\windows\curvestudio.iss"

      - name: Refresh the checksums (adds the installer when it was built)
        run: uv run python apps/desktop/packaging/build.py sums

      - name: Verify every published artifact exists and is non-empty
        shell: pwsh
        run: |
          $version = uv run python -c "from importlib import metadata; print(metadata.version('curvestudio-desktop'))"
          $required = @(
            "dist/release/curvestudio-desktop-$version-windows-x86_64.zip",
            "dist/release/SHA256SUMS-windows-x86_64"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              Write-Error "missing or empty artifact: $file"
              exit 1
            }
          }
          Get-Content dist/release/SHA256SUMS-windows-x86_64

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curvestudio-desktop-windows
          path: dist/release/*
          if-no-files-found: error

      - name: Release notes (the changelog section for this version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python apps/desktop/packaging/release_notes.py release-notes.md

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: CurveStudio ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
