name: Nightly slow NIST suite

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  slow:
    name: slow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Slow numerical tests
        run: uv run pytest tests/numerical -m slow -q
