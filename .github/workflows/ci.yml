name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Install Qt offscreen libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy packages/core/src
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -m "not slow"
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}

  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  image:
    name: container image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t curvestudio:ci .
      - name: Run the container (dev env, SQLite, read-only root filesystem)
        run: |
          docker run -d --name curvestudio-smoke \
            -p 127.0.0.1:8000:8000 \
            -e CURVESTUDIO_ENV=dev \
            -e CURVESTUDIO_DATABASE_URL=sqlite:////data/curvestudio.db \
            -v curvestudio-smoke-data:/data \
            --read-only --tmpfs /tmp \
            curvestudio:ci
      - name: Wait for the container to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then echo healthy; exit 0; fi
            sleep 2
          done
          docker logs curvestudio-smoke | tail -50
          exit 1
      - name: Smoke test
        run: deploy/smoke.sh http://127.0.0.1:8000
      - name: Clean up
        if: always()
        run: |
          docker rm -f curvestudio-smoke || true
          docker volume rm curvestudio-smoke-data || true
