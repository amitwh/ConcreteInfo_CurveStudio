name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy packages/core/src
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -m "not slow"

  image:
    name: container image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t curvestudio:ci .
      - name: Run the container (dev env, SQLite, read-only root filesystem)
        run: |
          docker run -d --name curvestudio-smoke \
            -p 127.0.0.1:8000:8000 \
            -e CURVESTUDIO_ENV=dev \
            -e CURVESTUDIO_DATABASE_URL=sqlite:////data/curvestudio.db \
            -v curvestudio-smoke-data:/data \
            --read-only --tmpfs /tmp \
            curvestudio:ci
      - name: Smoke test
        run: deploy/smoke.sh http://127.0.0.1:8000
      - name: Clean up
        if: always()
        run: |
          docker rm -f curvestudio-smoke || true
          docker volume rm curvestudio-smoke-data || true
