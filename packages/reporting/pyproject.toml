[project]
name = "curvestudio-reporting"
version = "0.10.2"
description = "CurveStudio reports: CSV, JSON, XLSX and PDF renderings of a fit"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "curvestudio-core",
    "curvestudio-plotting",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvestudio_reporting"]
