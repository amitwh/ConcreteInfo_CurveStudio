[project]
name = "curvestudio-core"
version = "1.12.0"
description = "CurveStudio core: data handling and curve-fitting engine (no GUI, no web)"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "lmfit>=1.3.4",
    "sympy>=1.14.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
curvestudio = "curvestudio.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvestudio"]
