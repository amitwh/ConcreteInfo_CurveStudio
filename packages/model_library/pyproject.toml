[project]
name = "curvestudio-models"
version = "0.10.6"
description = "CurveStudio hand-written model catalogue (registered through the curvestudio.models entry point)"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = ["curvestudio-core"]

[project.entry-points."curvestudio.models"]
library = "curvestudio_models.register:register_all"

[tool.uv.sources]
curvestudio-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvestudio_models"]
