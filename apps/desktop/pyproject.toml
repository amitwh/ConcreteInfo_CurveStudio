[project]
name = "curvestudio-desktop"
version = "1.12.0"
description = "ConcreteInfo CurveStudio desktop application (PySide6)"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "curvestudio-core",
    "curvestudio-plotting",
    "curvestudio-reporting",
    "PySide6-Essentials>=6.12",
    "pyqtgraph>=0.14",
]

[project.scripts]
curvestudio-desktop = "curvestudio_desktop.__main__:main"

[dependency-groups]
dev = ["pytest-qt>=4.5"]

[tool.uv.sources]
curvestudio-core = { workspace = true }
curvestudio-plotting = { workspace = true }
curvestudio-reporting = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvestudio_desktop"]
